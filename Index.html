  *{box-sizing:border-box}
  html,body{height:100%;margin:0;padding:0;background:#EDE7DE;

  .items-start{align-items:flex-start}
  .items-baseline{align-items:baseline}
  .justify-between{justify-content:space-between}

.duo{
  --bg:#F5F1EB; --surface:#FFFFFF; --surface-2:#EFE9E0; --sunk:#FBF8F4;
  --ink:#1B1A1F; --ink-2:#3D3A44; --muted:#6E6A73; --line:#E3DBD0;
  --accent:#4C3A87; --accent-ink:#FFFFFF; --accent-soft:#EAE5F7;
  --sage:#4F7A5B; --sage-soft:#E4EEE5;
  --blue:#31628F; --amber:#96650F; --danger:#A33F36; --danger-soft:#F6E6E3;
  --shadow:0 1px 2px rgba(27,26,31,.05), 0 10px 28px rgba(27,26,31,.05);
  --shadow-lg:0 4px 12px rgba(27,26,31,.08), 0 24px 60px rgba(27,26,31,.14);
  --r:20px; --r-sm:12px;
  color:var(--ink);
  font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  font-feature-settings:"cv05","ss01";
  -webkit-font-smoothing:antialiased;
}
.duo.dark{
  --bg:#131217; --surface:#1C1B21; --surface-2:#26242D; --sunk:#191820;
  --ink:#F0ECE6; --ink-2:#D2CCD8; --muted:#9A949F; --line:#2F2C38;
  --accent:#AD95F5; --accent-ink:#191331; --accent-soft:#272042;
  --sage:#86BC93; --sage-soft:#1E2C21;
  --blue:#83AEDC; --amber:#D5A24A; --danger:#E08277; --danger-soft:#33201E;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 28px rgba(0,0,0,.28);
  --shadow-lg:0 4px 12px rgba(0,0,0,.4), 0 24px 60px rgba(0,0,0,.5);
}
.duo *{box-sizing:border-box}
.duo-scroll{-webkit-overflow-scrolling:touch}
.duo-scroll::-webkit-scrollbar{width:0;height:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card-flat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm)}
.sunk{background:var(--sunk);border:1px solid var(--line);border-radius:var(--r-sm)}
.h1{font-size:26px;line-height:1.15;letter-spacing:-.022em;font-weight:640}
.h2{font-size:19px;line-height:1.2;letter-spacing:-.016em;font-weight:620}
.h3{font-size:15px;line-height:1.25;letter-spacing:-.008em;font-weight:600}
.body{font-size:14.5px;line-height:1.5}
.small{font-size:12.5px;line-height:1.45;color:var(--muted)}
.tnum{font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;
  border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:11px 16px;
  font-size:14.5px;font-weight:560;cursor:pointer;transition:transform .12s ease, background .15s ease, border-color .15s ease;min-height:44px}
.btn:active{transform:scale(.975)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn-ghost:hover{color:var(--ink)}
.btn-sm{padding:7px 12px;min-height:34px;font-size:13px}
.btn-danger{color:var(--danger);border-color:var(--danger)}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:999px;
  border:1px solid transparent;background:transparent;color:var(--ink);cursor:pointer;transition:background .15s ease}
.icon-btn:hover{background:var(--surface-2)}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink-2);padding:6px 11px;font-size:12.5px;font-weight:540;cursor:pointer;
  transition:background .15s ease,border-color .15s ease;min-height:32px}
.chip-on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.duo.dark .chip-on{color:var(--ink)}
.tag{display:inline-flex;align-items:center;gap:5px;border-radius:8px;padding:3px 8px;font-size:11.5px;font-weight:560;
  background:var(--surface-2);color:var(--muted)}
.input,.select,.textarea{width:100%;background:var(--sunk);border:1px solid var(--line);border-radius:12px;
  padding:12px 13px;font-size:15px;color:var(--ink);outline:none;font-family:inherit;transition:border-color .15s ease}
.input:focus,.select:focus,.textarea:focus{border-color:var(--accent)}
.textarea{min-height:88px;resize:vertical;line-height:1.45}
.duo :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.seg{display:flex;gap:2px;background:var(--surface-2);border-radius:999px;padding:3px}
.seg button{flex:1;border:0;background:transparent;color:var(--muted);font-size:13px;font-weight:560;
  padding:8px 6px;border-radius:999px;cursor:pointer;min-height:36px;font-family:inherit}
.seg button[data-on="1"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.bar{height:7px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.bar > i{display:block;height:100%;border-radius:999px;background:var(--accent);transition:width .45s cubic-bezier(.3,.9,.3,1)}
.sheet-bd{position:absolute;inset:0;background:rgba(20,18,24,.42);backdrop-filter:blur(2px);z-index:40;
  animation:fade .18s ease both}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:41;background:var(--bg);border-radius:26px 26px 0 0;
  max-height:92%;display:flex;flex-direction:column;box-shadow:var(--shadow-lg);animation:rise .26s cubic-bezier(.2,.8,.25,1) both}
@keyframes rise{from{transform:translateY(28px);opacity:.4}to{transform:translateY(0);opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
.pop{animation:pop .22s cubic-bezier(.2,.8,.25,1) both}
.grip{width:38px;height:4px;border-radius:999px;background:var(--line);margin:10px auto 2px}
.nav{display:flex;background:var(--surface);border-top:1px solid var(--line)}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:transparent;
  padding:9px 0 calc(9px + env(safe-area-inset-bottom));color:var(--muted);font-size:10.5px;font-weight:560;cursor:pointer;font-family:inherit}
.nav button[data-on="1"]{color:var(--accent)}
.duo.dark .nav button[data-on="1"]{color:var(--ink)}
.fab{position:absolute;right:16px;bottom:82px;z-index:30;width:56px;height:56px;border-radius:999px;border:0;
  background:var(--accent);color:var(--accent-ink);box-shadow:var(--shadow-lg);cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:transform .15s ease}
.fab:active{transform:scale(.93)}
.ribbon{position:relative;height:26px;border-radius:9px;background:var(--surface-2);overflow:hidden}
.ribbon i{position:absolute;top:0;bottom:0;border-radius:5px}
.strike{text-decoration:line-through;color:var(--muted)}
.link{color:var(--accent);text-decoration:none;font-weight:560;cursor:pointer;background:none;border:0;padding:0;font-family:inherit;font-size:inherit}
.duo.dark .link{color:var(--accent)}
.divider{height:1px;background:var(--line)}
@media (prefers-reduced-motion: reduce){ .duo *{animation-duration:.01ms !important;transition-duration:.01ms !important} }
